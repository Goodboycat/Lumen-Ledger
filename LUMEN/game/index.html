<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2a3a">
<title>Lumen Ledger — Make FinLit Fun</title>
<!-- 11B P3: favicon = inline SVG (a gold Spark coin), no extra file / request -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23FFD54F' stroke='%23263238' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23F9A825' stroke-width='4'/%3E%3Cpath d='M32 18l4 10 10 4-10 4-4 10-4-10-10-4 10-4z' fill='%23263238'/%3E%3C/svg%3E">
<!-- 10C: THE game page. Foundation Game (renderer/loop/input) + mountUI (7A/7B/7C) + createLumenGame (state machine over 10B's sandbox + 8B's story).
     No build step, no CDN: vanilla ES modules + vendor/three.module.js. Serve game/ statically and open this file. -->
<link rel="stylesheet" href="ui/base.css">
<link rel="stylesheet" href="ui/hud.css">
<link rel="stylesheet" href="ui/jars.css">
<link rel="stylesheet" href="ui/build.css">
<link rel="stylesheet" href="ui/ledger.css">
<link rel="stylesheet" href="ui/dialogue.css">
<link rel="stylesheet" href="ui/toast.css">
<link rel="stylesheet" href="ui/title.css">
<link rel="stylesheet" href="ui/pause.css">
<link rel="stylesheet" href="ui/touch.css">
<style>
  /* the Foundation HUD/help/touch markup is replaced by the 7A/7B/7C panels; only a tiny debug readout stays (hidden on phones) */
  #debug-stats { position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: max(4px, env(safe-area-inset-bottom)); z-index: 5; max-width: 46vw; opacity: .8; font: 600 10px/1.2 ui-monospace, Menlo, monospace; color: rgba(255,255,255,.55); pointer-events: none; display: none; }
  body.show-debug #debug-stats { display: block; }
  /* 11B P3: CSS-only loading screen — shown until game.start() (module loaded, story.json fetched); fades out 320 ms */
  #boot-loading { position: fixed; inset: 0; z-index: 98; display: grid; place-items: center; background: linear-gradient(#bfe8ff, #7ED957 140%); font: 900 22px/1.2 "Baloo 2", "Arial Rounded MT Bold", Nunito, Arial, sans-serif; color: #263238; letter-spacing: 1px; transition: opacity .32s ease-out; }
  #boot-loading.gone { opacity: 0; pointer-events: none; }
  #boot-loading .coin { width: 64px; height: 64px; border-radius: 50%; background: #FFD54F; border: 5px solid #263238; box-shadow: 0 5px 0 #263238; margin: 0 auto 14px; animation: boot-spin 1.1s ease-in-out infinite; }
  #boot-loading small { display: block; font-weight: 700; font-size: 12px; opacity: .7; margin-top: 6px; }
  @keyframes boot-spin { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.15); } }
  @media (prefers-reduced-motion: reduce) { #boot-loading .coin { animation: none; } }
  #boot-error { position: fixed; inset: auto 12px 12px 12px; z-index: 99; background: #fff3f3; border: 3px solid #b3261e; border-radius: 12px; padding: 10px 12px; font: 600 12px/1.4 system-ui, sans-serif; color: #5a1a14; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<main id="game-root">
  <div id="game-container"></div>
  <output id="debug-stats">fps — · calls —</output>
  <section id="boot-error" role="alert"></section>
  <aside id="boot-loading" aria-busy="true"><div><div class="coin"></div>Lumen Ledger<small>loading the island…</small></div></aside>
</main>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { Game } from './src/core/Game.js';
import { setOutlineThickness } from './src/core/Outline.js';
import { PROP_CATALOG } from './src/assets/props.js';
import { mountUI } from './ui/index.js';
import { createLumenGame, GAME_VERSION } from './src/Game.js';
import * as Save from './src/systems/save.js';
import { createAudio } from './src/core/Audio.js';

const root = document.getElementById('game-root');
const errEl = document.getElementById('boot-error');
const loadingEl = document.getElementById('boot-loading');
const hideLoading = () => { if (!loadingEl) return; loadingEl.classList.add('gone'); loadingEl.removeAttribute('aria-busy'); setTimeout(() => loadingEl.remove(), 400); };
const showError = (e) => { hideLoading(); errEl.style.display = 'block'; errEl.textContent = 'Lumen Ledger could not start:\n' + (e?.stack || e); console.error(e); };
window.addEventListener('error', (e) => showError(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => showError(e.reason));

try {
  const game = new Game(document.getElementById('game-container'));
  window.game = game;                                                                     // smoke.mjs reads game.stats / game.paused
  const params = new URLSearchParams(location.search);
  const seasonSeconds = +params.get('season') || undefined;                               // ?season=30 → fast seasons (QA); default = BALANCE 150 s
  const storyData = await fetch('./data/story.json').then((r) => { if (!r.ok) throw new Error('data/story.json ' + r.status); return r.json(); });

  // UI first (title owns the screen and pauses the game), then the state machine over it.
  const ui = mountUI(root, {
    bus: game.bus, stats: () => game.stats, input: game.input, catalog: PROP_CATALOG, seasonsToWin: 10,
    hasSave: () => Save.hasSave(),                                                        // 10D: localStorage slot → CONTINUE on the title (reload resumes)
    onOutline: setOutlineThickness, touch: true, version: `jam build · ${GAME_VERSION}`,
  });
  const lg = createLumenGame(game, { ui, storyData, seasonSeconds, seed: +params.get('seed') || undefined, debugKeys: params.has('debug') });
  window.ui = ui; window.lg = lg; window.sb = () => lg.sb; window.eco = () => lg.sb?.eco;
  // 12: audio — bus→SFX map + music; AudioContext is created only inside the first gesture (bus 'input:first' below). Missing
  // Ludo.ai files fall back to the manifest's synth sketches, so the build is never silent. Volumes follow the 7C settings sliders.
  const audio = createAudio({ bus: game.bus, settings: ui.pause?.settings });
  window.audio = audio;
  // the title opened before the manifest arrived → queue its music now (plays once 'input:first' unlocks the context)
  audio.load('./audio/manifest.json').then(() => { if (ui.title?.isOpen && !audio.state.currentMusic) audio.music('title'); }).catch(() => {});
  if (params.has('mute')) audio.setVolume({ sfx: 0, music: 0 });                           // ?mute (QA / trailer capture)
  // 10D: save slot for the Flutter WebView (14) — copy the text out before storage is cleared, paste it back in: LUMEN1:<base64>
  window.lumenSave = { export: () => lg.save.exportText(), import: (t) => lg.save.importText(t), clear: () => lg.save.clear(), has: () => lg.save.has(), describe: () => lg.save.describe() };
  if (params.has('import')) lg.save.importText(decodeURIComponent(params.get('import')));   // ?import=LUMEN1:… (WebView hand-off)

  // camera zoom on wheel (Foundation input) · touch class for the 7C pad · quality readout (F3 toggles the tiny debug line)
  game.input.onWheel = (dir) => { game.camera.zoom = THREE.MathUtils.clamp(game.camera.zoom + dir * 0.1, 0.5, 2.2); };
  if (game.input.isTouch) document.body.classList.add('is-touch');
  if (params.has('debug')) document.body.classList.add('show-debug');
  window.addEventListener('keydown', (e) => { if (e.code === 'F3') { e.preventDefault(); document.body.classList.toggle('show-debug'); } });
  const dbg = document.getElementById('debug-stats'); let acc = 0;
  // 11A: also shows the perf state — dpr (PixelRatioGovernor) · shadows (BlobShadows instances) · lod (CreatureLOD near/far counts)
  game.add({ update: (_dt, g, dtReal) => { acc += dtReal; if (acc < 0.5) return; acc = 0; const s = g.stats, e = lg.sb?.eco.state, pf = lg.sb?.perf;
    const perf = pf ? ` · dpr ${(pf.governor?.ratio ?? g.renderer?.getPixelRatio?.() ?? 1).toFixed(2)} · shadows ${pf.shadows?.count ?? pf.shadows?.mesh?.count ?? '—'}${pf.lod?.stats ? ` · lod ${pf.lod.stats.near}/${pf.lod.stats.mid}/${pf.lod.stats.far}` : ''}` : '';
    dbg.textContent = `fps ${s.fps} · calls ${s.drawCalls} · tris ${(s.triangles / 1000).toFixed(0)}k · ${lg.state}${e ? ` · S${e.season} ${(e.day01 * 100).toFixed(0)}% · spark ${e.spark} · fog ${(e.fog01 * 100).toFixed(0)}%` : ''}${perf}`; } });

  // 11B P2.1: iOS/Android audio unlock — the FIRST user gesture emits `input:first` once (12 audio hooks it to create/resume its
  // AudioContext inside the gesture; until then it may park a context on window.lumenAudioCtx and we resume it here).
  {
    let fired = false;
    const unlock = () => { if (fired) return; fired = true; try { window.lumenAudioCtx?.resume?.(); } catch {} game.bus.emit('input:first', { touch: game.input.isTouch }); for (const t of ['pointerdown', 'touchend', 'keydown']) window.removeEventListener(t, unlock, true); };
    for (const t of ['pointerdown', 'touchend', 'keydown']) window.addEventListener(t, unlock, { capture: true, passive: true });
  }
  // 11B P2.1: iOS Safari fires gesturestart for pinch even with user-scalable=no; Android double-tap zoom is killed by touch-action in base.css
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // 11B P2.2: Android back button / WebView back — instead of leaving the page it behaves like Esc (closes the tray / placing, else
  // toggles the pause menu, via the same window keydown chain 7A/7C already own). A sentinel history entry is kept so there is
  // always something to pop; the page itself is never left while the game is running (the title screen's back = real back).
  if (!params.has('nohistory')) {
    const push = () => history.pushState({ lumen: 1 }, '', location.href);
    push();
    window.addEventListener('popstate', () => {
      if (ui.title?.isOpen) { history.back(); return; }                                   // on the title: let the back button leave normally
      push();                                                                             // re-arm the sentinel
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', bubbles: true, cancelable: true }));
    });
  }

  // ?autoplay (smoke / trailer): skip the title. ?endless: start in Endless.
  if (params.has('autoplay') || params.has('endless')) setTimeout(() => game.bus.emit('ui:start', { mode: params.has('endless') ? 'endless' : 'story' }), 300);
  game.start();
  requestAnimationFrame(() => requestAnimationFrame(hideLoading));                      // 11B P3: first real frame is on screen → fade the loading layer
} catch (e) { showError(e); }
</script>
</body>
</html>
