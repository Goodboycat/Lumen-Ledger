<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lumen Ledger — Chat 5 Build & Placement Demo</title>
<link rel="stylesheet" href="ui/base.css">
<style>
  .panel { position: absolute; left: 12px; top: 70px; z-index: 10; background: rgba(255,248,231,.94); border: 3px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; font-weight: 600; max-width: 300px; pointer-events: auto; }
  .panel b { display: block; font-size: 13px; margin-bottom: 4px; }
  .row { display: flex; gap: 5px; margin: 6px 0; flex-wrap: wrap; }
  .btn { background: var(--gold); border: 3px solid var(--ink); border-radius: 10px; padding: 4px 8px; font: inherit; font-weight: 800; box-shadow: 0 3px 0 var(--ink); cursor: pointer; font-size: 11px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn.alt { background: var(--blue); } .btn.warn { background: var(--orange); } .btn.sel { outline: 3px solid #fff; }
  #spark { font-size: 15px; font-weight: 900; color: #7a4a00; }
  #log { font-size: 11px; line-height: 1.3; white-space: pre; font-family: ui-monospace, Menlo, monospace; max-height: 26vh; overflow: auto; }
  #mode { font-weight: 900; color: #1b5e20; }
  @media (max-width: 600px) { .panel { max-width: 190px; font-size: 11px; top: 64px; } #log { display: none; } }
  .touch-bar { position: absolute; right: 12px; bottom: 16px; z-index: 10; display: none; flex-direction: column; gap: 8px; pointer-events: auto; }
  .is-touch .touch-bar { display: flex; }
  .touch-bar .btn { padding: 10px 14px; font-size: 14px; }
</style>
</head>
<body>
<div id="game-root">
  <div id="game-container"></div>
  <header id="hud" class="hud">
    <div class="ribbon"><span class="ribbon-title">LUMEN LEDGER</span><span class="ribbon-sub">Chat 5 · Build</span></div>
    <div id="stats" class="stats">fps — · calls —</div>
  </header>
  <section class="panel" id="panel">
    <b>Build & placement &nbsp; <span id="spark">✦ 0</span></b>
    <div>mode: <span id="mode">walk</span> &nbsp; <span id="pick"></span></div>
    <div class="row" id="stall-buttons"></div>
    <div class="row">
      <button class="btn alt" id="btn-build">B · build</button>
      <button class="btn alt" id="btn-rot">R · rotate</button>
      <button class="btn warn" id="btn-demo">X · demolish</button>
      <button class="btn" id="btn-up">U · upgrade</button>
      <button class="btn" id="btn-dbg">O · cells</button>
      <button class="btn" id="btn-cash">$ · +200</button>
    </div>
    <div id="log"></div>
  </section>
  <aside id="help" class="help">
    <b>1–9/0/-/=</b> stall type · <b>B</b> build mode (ghost follows mouse; tap moves it on touch) · <b>click / Enter</b> place · <b>R</b> rotate · <b>Esc</b> cancel · <b>X</b> demolish nearest to Pip · <b>U</b> upgrade nearest · <b>D</b> decor crate · <b>O</b> occupancy · <b>WASD</b> move
  </aside>
  <nav class="touch-bar" id="touch-bar">
    <button class="btn" id="t-build">BUILD</button>
    <button class="btn alt" id="t-place">PLACE</button>
    <button class="btn alt" id="t-rot">ROTATE</button>
    <button class="btn warn" id="t-demo">DEMOLISH</button>
    <button class="btn" id="t-up">UPGRADE</button>
  </nav>
</div>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { Game } from './src/core/Game.js';
import { Island } from './src/world/Island.js';
import { VFX } from './src/vfx/VFX.js';
import { HeroController } from './src/entities/HeroController.js';
import { PROP_CATALOG, STALL_TYPES } from './src/assets/props.js';
import { makeEconomy } from './src/systems/economyData.js';
import { BuildSystem } from './src/systems/build.js';

const container = document.getElementById('game-container');
const game = new Game(container);
window.game = game;

// World: Island v2 (1C) with its zones, starter trees hidden (they are not on the build grid)
const island = new Island({ radius: 11, seed: 7, starterProps: false, zonesUnlocked: 3 });
game.scene.add(island.group);
game.add({ update: (dt) => island.update(dt) });
const vfx = game.add(new VFX(game));
const isLand = (x, z) => island.isLand(x, z);

// Economy (4B balance) — real costs, real pouch
const eco = makeEconomy({ bus: game.bus, seed: 3, autoSeason: false });
eco.state.spark = 600;

// Build system
const build = new BuildSystem(game, { island, economy: eco, catalog: PROP_CATALOG, vfx });
game.add({ update: (dt) => build.update(dt) });
window.build = build; window.eco = eco;

// Hero (walks around; build mode does not block walking)
const hero = new HeroController(game, { vfx, targets: () => [], isLand });
hero.root.position.set(0, 0, 3);
game.add({ update: (dt) => hero.update(dt) });
game.followTarget = hero.root.position;
game.camera.zoom = 1.35;
game.camera.snapTo(hero.root.position);
game.input.onWheel = (dir) => { game.camera.zoom = THREE.MathUtils.clamp(game.camera.zoom + dir * 0.1, 0.6, 1.8); };

// ---- UI ----
const $ = (id) => document.getElementById(id);
const logEl = $('log'), modeEl = $('mode'), pickEl = $('pick'), sparkEl = $('spark');
const lines = [];
const log = (s) => { lines.unshift(s); if (lines.length > 14) lines.pop(); logEl.textContent = lines.join('\n'); };
const ids = STALL_TYPES.map((t) => 'stall_' + t);
const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '='];
let pick = ids[0];
const btns = ids.map((id, i) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = `${keys[i]} ${PROP_CATALOG[id].name} ${build.cost(id)}`; b.addEventListener('click', () => setPick(id)); $('stall-buttons').appendChild(b); return b; });
function setPick(id) { pick = id; btns.forEach((b, i) => b.classList.toggle('sel', ids[i] === id)); pickEl.textContent = `${PROP_CATALOG[id].name} (${build.cost(id)} ✦)`; if (build.mode === 'place') build.enter(id); }
function refresh() { sparkEl.textContent = `✦ ${eco.state.spark}`; modeEl.textContent = build.mode === 'place' ? `BUILD ${PROP_CATALOG[build.propId].name} rot ${build.rot * 90}°` : 'walk'; }
setPick(pick); refresh();

const toggleBuild = () => { if (build.mode === 'place') build.exit(); else build.enter(pick); refresh(); };
const nearHero = () => ({ x: hero.root.position.x + Math.sin(hero.facing) * 1.2, z: hero.root.position.z + Math.cos(hero.facing) * 1.2 });
const demolishNear = () => { const e = build.nearest(nearHero().x, nearHero().z, 2.5) || build.nearest(hero.root.position.x, hero.root.position.z, 3); if (e) build.demolish(e); else log('nothing near Pip to demolish'); };
const upgradeNear = () => { const e = build.nearest(nearHero().x, nearHero().z, 2.5) || build.nearest(hero.root.position.x, hero.root.position.z, 3); if (e) build.upgrade(e); else log('nothing near Pip to upgrade'); };
let dbg = false; const toggleDbg = () => { dbg = build.setDebug(!dbg); log(`occupancy overlay ${dbg ? 'on' : 'off'} (${build.cells.size} cells)`); };

$('btn-build').addEventListener('click', toggleBuild);
$('btn-rot').addEventListener('click', () => { build.rotate(); refresh(); });
$('btn-demo').addEventListener('click', demolishNear);
$('btn-up').addEventListener('click', upgradeNear);
$('btn-dbg').addEventListener('click', toggleDbg);
$('btn-cash').addEventListener('click', () => { eco.earn(200, 'demo'); });
$('t-build').addEventListener('click', toggleBuild);
$('t-place').addEventListener('click', () => game.input.press('build'));
$('t-rot').addEventListener('click', () => { build.rotate(); refresh(); });
$('t-demo').addEventListener('click', demolishNear);
$('t-up').addEventListener('click', upgradeNear);

window.addEventListener('keydown', (e) => {
  const i = keys.indexOf(e.key); if (i >= 0 && !e.ctrlKey && !e.metaKey) { setPick(ids[i]); return; }
  if (e.code === 'KeyR') { build.rotate(); refresh(); }
  if (e.code === 'KeyX') demolishNear();
  if (e.code === 'KeyU') upgradeNear();
  if (e.code === 'KeyO') toggleDbg();
  if (e.code === 'KeyD' && !e.repeat) { pick = 'crate'; pickEl.textContent = 'crate'; if (build.mode === 'place') build.enter(pick); }
  if (e.code === 'Escape') { build.exit(); refresh(); }
  if (e.code === 'Enter' && build.mode === 'place') build.confirm();
});
// B is the Input 'build' action → BuildSystem confirms when a ghost is up; when no ghost, B enters build mode
const prevAction = game.input.onAction;
game.input.onAction = (name) => { if (prevAction) prevAction(name); if (name === 'build' && build.mode !== 'place') { build.enter(pick); refresh(); } if (name === 'pause') { build.exit(); refresh(); } };
// Tap: in build mode → place (mouse) or move ghost / confirm (touch two-tap); otherwise nothing (hero walks with WASD/joystick)
game.input.onTap = (world) => {
  if (build.mode !== 'place') return;
  if (game.input.isTouch) { const same = Math.round(world.x - (build.footprint(build.propId)[0] - 1) / 2) === build.cursor.cx && Math.round(world.z - (build.footprint(build.propId)[1] - 1) / 2) === build.cursor.cz; if (same) build.confirm(); else build.moveTo(world.x, world.z); }
  else { build.moveTo(world.x, world.z); build.confirm(); }
};

// Events → log
game.bus.on('build:placed', (p) => { log(`placed ${p.id} @${p.cx},${p.cz} rot${p.rot} −${p.cost}`); refresh(); });
game.bus.on('build:removed', (p) => { log(`removed ${p.id} +${p.refund}`); refresh(); });
game.bus.on('build:upgraded', (p) => { log(`upgraded ${p.id} → L${p.level} −${p.cost}`); refresh(); });
game.bus.on('build:denied', (p) => { log(`denied: ${p.why}${p.cost ? ' (' + p.cost + ' ✦)' : ''}`); vfx.flash.flash('#ff5566', 120, 0.25); game.camera.shake(0.15); refresh(); });
game.bus.on('build:enter', () => refresh()); game.bus.on('build:exit', () => refresh());
game.bus.on('eco:spark', () => refresh());

// Pre-built starter market so the page shows something at once (paid from the pouch? no — load() is free)
const starter = [['stall_fruit', -3, -2, 0], ['stall_bread', 1, -2, 0], ['bench', -1, 1, 0], ['lantern_post', 3, 1, 0], ['crate', -4, 1, 0]];
build.load(starter.map(([id, cx, cz, rot]) => ({ id, cx, cz, rot, level: 1 })));
log(`starter market loaded (${build.placed.size} props, ${build.cells.size} cells)`);

const statsEl = document.getElementById('stats');
game.add({ update: () => { const s = game.stats; statsEl.textContent = `fps ${s.fps} · calls ${s.drawCalls} · tris ${(s.triangles / 1000).toFixed(0)}k`; } });
if (game.input.isTouch) document.body.classList.add('is-touch');
game.start();
</script>
</body>
</html>
