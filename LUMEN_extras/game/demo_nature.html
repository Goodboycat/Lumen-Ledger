<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lumen Ledger — Chat 1B Nature Demo</title>
<link rel="stylesheet" href="ui/base.css">
<style>
  .panel { position: absolute; left: 12px; top: 70px; z-index: 10; background: rgba(255,248,231,.94); border: 3px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; font-weight: 600; max-width: 270px; pointer-events: auto; }
  .panel b { display: block; font-size: 13px; margin-bottom: 4px; }
  .row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
  .btn { background: var(--gold); border: 3px solid var(--ink); border-radius: 10px; padding: 4px 10px; font: inherit; font-weight: 800; box-shadow: 0 3px 0 var(--ink); cursor: pointer; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn.alt { background: var(--blue); } .btn.warn { background: var(--orange); }
  #tris { font-size: 11px; line-height: 1.3; white-space: pre; font-family: ui-monospace, Menlo, monospace; font-weight: 600; max-height: 40vh; overflow: auto; }
  .label { position: absolute; transform: translate(-50%, -100%); background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 1px 6px; font-size: 10px; font-weight: 800; pointer-events: none; white-space: nowrap; }
  @media (max-width: 600px) { .panel { max-width: 180px; font-size: 11px; top: 64px; } #tris { display: none; } }
</style>
</head>
<body>
<div id="game-root">
  <div id="game-container"></div>
  <header id="hud" class="hud">
    <div class="ribbon"><span class="ribbon-title">LUMEN LEDGER</span><span class="ribbon-sub">Chat 1B · Nature</span></div>
    <div id="stats" class="stats">fps — · calls —</div>
  </header>
  <section class="panel" id="panel">
    <b>Nature props</b>
    <div class="row">
      <button class="btn" id="btn-wind">Wind: ON</button>
      <button class="btn alt" id="btn-scatter">Re-scatter</button>
      <button class="btn warn" id="btn-labels">Labels</button>
    </div>
    <div id="tris"></div>
  </section>
  <aside id="help" class="help">
    <b>N</b> wind on/off &nbsp;·&nbsp; <b>R</b> re-scatter &nbsp;·&nbsp; <b>L</b> labels &nbsp;·&nbsp; <b>1/2/3</b> show trees / rocks / bushes only &nbsp;·&nbsp; <b>0</b> all &nbsp;·&nbsp; <b>WASD</b> move Pip &nbsp;·&nbsp; wheel zoom
  </aside>
  <div id="labels"></div>
</div>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { Game } from './src/core/Game.js';
import { Island } from './src/world/Island.js';
import { VFX } from './src/vfx/VFX.js';
import { HeroController } from './src/entities/HeroController.js';
import { PROP_CATALOG, makeProp, propsByCategory, countTris } from './src/assets/props.js';
import { makeFlowerField, makeGrassTufts, makeRandomNature, swayAll, setWindEnabled, isWindEnabled } from './src/assets/props/nature.js';

const container = document.getElementById('game-container');
const game = new Game(container);
window.game = game;

// World (Foundation island; its own placeholder trees/rocks are hidden so only 1B props show)
const island = new Island({ radius: 11, seed: 7 });
island.group.traverse((o) => { if (o.name === 'tree' || o.name === 'rock') o.visible = false; });
game.scene.add(island.group);
game.add({ update: (dt) => island.update(dt) });
const vfx = game.add(new VFX(game));
const isLand = (x, z) => island.isLand(x, z);

// ---- Showcase rows: every nature prop, grouped (trees / rocks / bushes), in front of Pip ----
const ids = propsByCategory('nature');
const rowsDef = [
  { key: 'tree', z: -6.0, gap: 1.6 },
  { key: 'rock', z: -3.4, gap: 1.5 },
  { key: 'bush', z: -1.2, gap: 1.5 },
];
const showcase = [];
for (const row of rowsDef) {
  const list = ids.filter((id) => id.startsWith(row.key));
  list.forEach((id, i) => {
    const g = makeProp(id, { seed: i + 1 });
    g.position.set((i - (list.length - 1) / 2) * row.gap, 0, row.z);
    game.scene.add(g); showcase.push(g);
  });
}

// ---- Scatter: ~50 random trees/rocks/bushes on the island ring (outside the showcase rows) ----
let scattered = [];
let flowers = null, tufts = null;
function scatter(seed = Math.floor(Math.random() * 1e6)) {
  for (const g of scattered) { g.userData.dispose && g.userData.dispose(); game.scene.remove(g); }
  scattered = [];
  if (flowers) game.scene.remove(flowers); if (tufts) game.scene.remove(tufts);
  let s = seed; const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  let n = 0, tries = 0;
  while (n < 50 && tries < 2000) {
    tries++;
    const x = (r() * 2 - 1) * 11, z = (r() * 2 - 1) * 11;
    if (!isLand(x, z)) continue;
    if (z > -7.5 && z < 0.5 && Math.abs(x) < 8.5) continue;      // keep the showcase rows clear
    if (Math.hypot(x, z - 3.5) < 2.2) continue;                      // keep Pip's spot clear
    const g = makeRandomNature(r);
    g.position.set(x, 0, z); g.rotation.y = r() * Math.PI * 2;
    game.scene.add(g); scattered.push(g); n++;
  }
  // 300 flowers + 200 grass tufts: ONE draw call each (InstancedMesh, no outline, shader wind)
  flowers = makeFlowerField(300, (x, z) => isLand(x, z) && !(z > -7.5 && z < 0.5 && Math.abs(x) < 8.5), { seed: seed + 1 });
  tufts = makeGrassTufts(200, isLand, { seed: seed + 2 });
  game.scene.add(flowers, tufts);
}
scatter(4242);

// Wind: one call per frame drives every crown + both instanced fields (pure function of time)
game.add({ update: () => swayAll(game.time) });

// Hero for scale
const hero = new HeroController(game, { vfx, targets: () => [], isLand });
hero.root.position.set(0, 0, 3.5);
game.add({ update: (dt) => hero.update(dt) });
game.followTarget = hero.root.position;
game.camera.zoom = 1.5;
game.camera.snapTo(hero.root.position);
game.input.onWheel = (dir) => { game.camera.zoom = THREE.MathUtils.clamp(game.camera.zoom + dir * 0.1, 0.6, 1.8); };

// ---- Controls ----
const windBtn = document.getElementById('btn-wind');
const toggleWind = () => { setWindEnabled(!isWindEnabled()); windBtn.textContent = `Wind: ${isWindEnabled() ? 'ON' : 'OFF'}`; };
const showOnly = (prefix) => { for (const g of showcase) g.visible = !prefix || g.userData.kind.startsWith(prefix); };
let labelsOn = true;
const toggleLabels = () => { labelsOn = !labelsOn; labelsRoot.style.display = labelsOn ? '' : 'none'; };
windBtn.addEventListener('click', toggleWind);
document.getElementById('btn-scatter').addEventListener('click', () => scatter());
document.getElementById('btn-labels').addEventListener('click', toggleLabels);
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyN') toggleWind();
  if (e.code === 'KeyR') scatter();
  if (e.code === 'KeyL') toggleLabels();
  if (e.code === 'Digit1') showOnly('tree');
  if (e.code === 'Digit2') showOnly('rock');
  if (e.code === 'Digit3') showOnly('bush');
  if (e.code === 'Digit0') showOnly(null);
});
game.input.onTap = (world) => {
  // tap a prop → little dust puff + pop label (proves pivot/placement)
  let best = null, bd = 1.0;
  for (const g of showcase.concat(scattered)) { const d = Math.hypot(g.position.x - world.x, g.position.z - world.z); if (d < bd) { bd = d; best = g; } }
  if (best) { vfx.dust.burst(best.position.clone(), 8, { size: 0.25, speed: 1.8, dur: 0.45, up: 0.5 }); const p = best.position.clone(); p.y = 1.6; vfx.pop.show(p, best.userData.name, { color: '#FFD54F', dur: 0.8, size: 0.9 }); }
};

// ---- Tri / mesh table (budget: ≤ 150 tris small prop, ≤ 4 draw calls incl. outline) ----
const trisEl = document.getElementById('tris');
const rows = ids.map((id) => {
  const g = PROP_CATALOG[id].make({ outline: true, sway: false });
  let meshes = 0, hulls = 0; g.traverse((o) => { if (o.isMesh) (o.userData.isOutline ? hulls++ : meshes++); });
  g.userData.dispose && g.userData.dispose();
  return `${id.padEnd(15)} ${String(countTris(g)).padStart(4)}t ${meshes + hulls}dc`;
});
trisEl.textContent = 'prop             tris  draw calls\n' + rows.join('\n') + `\nflower_field     ${countTris(flowers)}t 1dc (300 inst)\ngrass_tufts      ${countTris(tufts)}t 1dc (200 inst)`;

// ---- Floating labels above showcase props ----
const labelsRoot = document.getElementById('labels');
const labels = showcase.map((g) => { const el = document.createElement('div'); el.className = 'label'; el.textContent = g.userData.name; labelsRoot.appendChild(el); return el; });
const v = new THREE.Vector3();
game.add({ lateUpdate: () => {
  if (!labelsOn) return;
  const w = container.clientWidth, h = container.clientHeight;
  showcase.forEach((g, i) => {
    const el = labels[i];
    if (!g.visible) { el.style.display = 'none'; return; }
    v.set(g.position.x, 2.4, g.position.z).project(game.camera.three);
    if (v.z > 1) { el.style.display = 'none'; return; }
    el.style.display = ''; el.style.left = ((v.x + 1) / 2 * w) + 'px'; el.style.top = ((1 - v.y) / 2 * h) + 'px';
  });
} });

const statsEl = document.getElementById('stats');
game.add({ update: () => { const s = game.stats; statsEl.textContent = `fps ${s.fps} · calls ${s.drawCalls} · tris ${(s.triangles / 1000).toFixed(0)}k`; } });

if (game.input.isTouch) document.body.classList.add('is-touch');
game.start();
</script>
</body>
</html>
